<!DOCTYPE html>
<html>
<head>
    <title>Ruswandi Indonesia Agency</title>

    <link rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h2>Land Rental Agency - Ruswandi Indonesia Agency</h2>
    </nav>

    <!-- Hero Section -->
    <section>
        <h1>Welcome to Ruswandi Indonesia Agency</h1>
        <p>Your trusted partner for land rentals in Indonesia.</p>
    </section>

    <!-- Land listing -->
    <section>  
        {% for land in lands %}
        <div class="land-card">
            <h2>{{ land[1] }}</h2>
            <p><strong>ID:</strong> {{ land[0] }}</p>

            <p>
                <strong>Price:</strong>
                ${{ "{:,.2f}".format(land[2]) }}
            </p>

            <button>View Details</button>
        </div>
        {% endfor %}
    </section>
</body>
</html>
